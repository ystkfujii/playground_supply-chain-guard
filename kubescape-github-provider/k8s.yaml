apiVersion: v1
kind: Namespace
metadata:
  name: kubescape-github-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubescape-github-provider
  namespace: kubescape-github-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubescape-github-provider
  template:
    metadata:
      labels:
        app: kubescape-github-provider
    spec:
      containers:
        - name: provider
          image: ghcr.io/ystkfujii/playground_supply-chain-guard/kubescape-github-provider:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GITHUB_OWNER
              value: ystkfujii
            - name: GITHUB_REPO
              value: playground_supply-chain-guard
            - name: GITHUB_BRANCH
              value: kubescape-github-provider
            - name: GITHUB_PATH_PREFIX
              value: kubescape-sbom
            - name: GITHUB_BATCH_MAX_ITEMS
              value: "20"
            - name: GITHUB_BATCH_MAX_INTERVAL
              value: "10s"
            - name: GITHUB_BATCH_QUEUE_SIZE
              value: "1000"
            - name: GITHUB_API_TIMEOUT
              value: "30s"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubescape-github-provider
                  key: GITHUB_TOKEN
            - name: PROVIDER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kubescape-github-provider
                  key: PROVIDER_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubescape-github-provider
  namespace: kubescape-github-provider
spec:
  selector:
    app: kubescape-github-provider
  ports:
    - name: http
      port: 8080
      targetPort: http
