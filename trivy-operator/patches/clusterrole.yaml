apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - replicationcontrollers
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - statefulsets
      - daemonsets
      - deployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
    - aquasecurity.github.io
    resources:
    - clustercompliancedetailreports
    - clustercompliancereports
    - clusterconfigauditreports
    - clusterinfraassessmentreports
    - clusterrbacassessmentreports
    - clustersbomreports
    - clustervulnerabilityreports
    - configauditreports
    - exposedsecretreports
    - infraassessmentreports
    - rbacassessmentreports
    - sbomreports
    - vulnerabilityreports
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
