          allowPrivilegeEscalation: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /etc/config/clusterData.json
          name: ks-cloud-config
          readOnly: true
          subPath: clusterData.json
        - mountPath: /etc/config/config.json
          name: config
          readOnly: true
          subPath: config.json
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: storage
      tolerations: null
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kubescape-storage
      - configMap:
          items:
          - key: clusterData
            path: clusterData.json
          name: ks-cloud-config
        name: ks-cloud-config
      - configMap:
          items:
          - key: config.json
            path: config.json
          name: storage
