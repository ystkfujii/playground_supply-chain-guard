apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescape
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ystkfujii/playground_supply-chain-guard
    targetRevision: main
    path: kubescape/generated/install.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kubescape
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
